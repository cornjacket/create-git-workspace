# repos.yml — this workspace's membership registry
#
# CONTENT: seeded once by create-git-workspace, then it is yours. `update.sh`
# never touches it.
#
# The single source of truth for *what repos physically live in this workspace*.
# `.workspace/scripts/bootstrap.sh` reconstitutes the whole workspace from this
# file; it is also the roster `status.sh` and `guard.sh` iterate over.
#
# Each entry is one managed checkout. Two kinds:
#
#   type: standard   a normal clone            → git clone <url> <path>
#   type: worktree   a linked worktree of an   → git worktree add <path> <branch>
#                    already-present repo         (run from parent_repo_path)
#
# NOTE ON WORKTREES: a worktree's `.git` is a *file* (a gitdir pointer), not a
# directory. Tooling must test `[ -e <path>/.git ]`, never `[ -d <path>/.git ]`.
#
# Fields
# ------
#   name              unique short identifier
#   url               remote URL          (standard: required; worktree: omit)
#   path              location relative to the workspace root
#   type              standard | worktree
#   branch            branch to checkout (standard) / attach the worktree to
#   parent_repo_path  worktree ONLY — path of the repo the worktree hangs off
#   tags              freeform labels for filtering (e.g. app, generator)
#   description       one line of "what is this repo", shown in README.md's
#                     roster. `add-repo` seeds it from the repo's GitHub
#                     description, falling back to the first paragraph of its
#                     README/CLAUDE.md; it is stored (not re-derived) so the
#                     render is stable and you can correct a bad guess here.
#
# Status flags (all optional) — read by the daily status run
# ----------------------------------------------------------
#   enabled           false = skip entirely: no summary, no plan row  (default true)
#   report_inactivity false = keep tracking, but stay out of the "No updates"
#                     list on quiet days                             (default true)
#   priority          band, not a rank — 1 is highest. Ties are expected and
#                     fall back to this file's order. Unset sorts last rather
#                     than silently claiming the top band.           (default 3)
#
# Routine registration
# --------------------
#   routine_registered
#                     true once this repo has been added to the scheduled
#                     routine's `sources` pre-clone list — the one half of
#                     registration no script can do for you (status-guide §5.2).
#
#                     ABSENT MEANS OUTSTANDING, not done. Until it is true,
#                     `make status` reports "routine not registered" and exits
#                     non-zero, and `daily-plan-summary.md` opens with a banner.
#                     That is deliberate: a repo missing from `sources` is not
#                     an error the remote run reports — it reads the repo as
#                     unreadable and quietly leaves it out of the rollup.
#
#                     Written ONLY by `make routine-registered ARGS="<name>"`
#                     (`add-repo` seeds it false). It is recorded here rather
#                     than printed because this file is what survives a fresh
#                     clone on another machine.
#
# Example — delete the comment markers and edit, or add entries by hand:
#
#   repos:
#     # ---- standard clones ----
#     - name: my-app
#       url: git@github.com:me/my-app.git
#       path: my-app
#       type: standard
#       branch: main
#       description: The customer-facing web app.
#       tags: [app]
#       routine_registered: false
#
#     # ---- worktrees ----
#     # `my-lib` is checked out as a container; `main` and `feature-x` are
#     # linked worktrees hanging off it.
#     - name: my-lib-main
#       path: my-lib/main
#       type: worktree
#       branch: main
#       parent_repo_path: my-lib
#       tags: [lib, worktree]

repos: []
