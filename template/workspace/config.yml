# config.yml — this workspace's identity.
#
# CONTENT: seeded once by `setup.sh`, then it is yours. `update.sh` never
# overwrites it — it is where the generator RECOVERS the workspace name (so a
# directory rename does not break regeneration).
#
#   name              the workspace name; substituted into CLAUDE.md
#   git_author        one or more emails; filters `git log --author` so the
#                     summary is scoped to YOU. The status run hard-fails on an
#                     unresolved placeholder — the remote routine has no ambient
#                     git identity to fall back on.
#   generator_version the create-git-workspace version that stamped this
#                     workspace (canonical; CLAUDE.md carries a derived echo).
#   routine_url       OPTIONAL. The Claude /schedule routine that runs the daily
#                     status job for this workspace. Creating that routine is a
#                     manual step (status-guide.md §5.1); paste its URL here and
#                     run `make readme` so the roster block links it instead of
#                     saying "not set up yet".

name: {{WORKSPACE_NAME}}
git_author:
  - {{GIT_AUTHOR}}
generator_version: {{GENERATOR_VERSION}}
# routine_url: https://claude.ai/code/routines/trig_...
